name: Tool metadata update
description: Request an update to a tool summary, citation, repository link, or usage note.
title: "[Tool update]: "
labels: ["documentation"]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options:
        - SinProVirP
        - VirHostHunter / Viral-Host-Hunter
        - MetaPGN
        - Other
    validations:
      required: true
  - type: textarea
    id: change
    attributes:
      label: What should be updated?
      description: Describe the outdated text and the proposed correction.
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source
      description: Link to the paper, release, README, or repository evidence for this update.
    validations:
      required: true
